<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Harold Tcheuko Wouassi | Full-stack and mobile developer</title>
  <desc id="desc">Montréal. Computer Science and Software Engineering at UQAM. Web, mobile and AI. Animated cyan and violet developer banner.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#15132a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="0.5" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".16"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern>
    <clipPath id="panel"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}
    .cursor{animation:blink 1.2s steps(2,end) infinite}
    .spark{animation:pulse 3s ease-in-out infinite}
    .orbit{transform-origin:1000px 155px;animation:orbit 24s linear infinite}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{50%{opacity:.3}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.cursor,.spark,.orbit{animation:none}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <ellipse cx="1040" cy="160" rx="330" ry="270" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
    <g class="sans">
      <rect x="48" y="38" width="230" height="30" rx="15" fill="#12262a" stroke="#245052"/>
      <circle class="spark" cx="65" cy="53" r="4" fill="#5eead4"/>
      <text x="80" y="58" fill="#99f6e4" font-size="12" font-weight="700" letter-spacing="1.4">BUILDING WITH PURPOSE</text>
      <text x="48" y="134" fill="#f1f5f9" font-size="47" font-weight="700" letter-spacing="-1.5">Harold Tcheuko Wouassi</text>
      <text x="49" y="177" fill="#a5b4c9" font-size="23">Full-stack &amp; mobile developer</text>
    </g>
    <g class="mono" font-size="18">
      <text x="49" y="224" fill="#5eead4">&gt;</text>
      <text x="74" y="224" fill="#dbeafe">Web. Mobile. AI. Real-world products.</text>
      <rect class="cursor" x="484" y="207" width="10" height="21" fill="#67e8f9"/>
    </g>
    <path d="M48 254H759" stroke="#293346"/>
    <text class="sans" x="49" y="289" fill="#94a3b8" font-size="15" letter-spacing=".5">MONTRÉAL, CANADA</text>
    <circle cx="237" cy="284" r="2.5" fill="#475569"/>
    <text class="sans" x="255" y="289" fill="#94a3b8" font-size="15" letter-spacing=".5">UQAM</text>
    <circle cx="322" cy="284" r="2.5" fill="#475569"/>
    <text class="sans" x="340" y="289" fill="#94a3b8" font-size="15" letter-spacing=".5">FR / EN</text>
    <g fill="none" stroke="#a78bfa">
      <circle cx="1000" cy="155" r="102" stroke-opacity=".18"/>
      <circle cx="1000" cy="155" r="77" stroke-opacity=".13" stroke-dasharray="3 9"/>
      <g class="orbit"><circle cx="1000" cy="53" r="5" fill="#a78bfa" stroke="none"/><circle cx="1000" cy="257" r="3" fill="#5eead4" stroke="none"/></g>
    </g>
    <rect x="937" y="92" width="126" height="126" rx="30" fill="#151c2c" stroke="#334155" transform="rotate(-8 1000 155)"/>
    <text class="mono" x="1000" y="174" text-anchor="middle" font-size="54" font-weight="700" fill="url(#accent)">&lt;/&gt;</text>
    <text class="mono" x="1000" y="289" text-anchor="middle" fill="#a78bfa" font-size="14">@roldhaa</text>
  </g>
</svg>
