name: Contribution snake

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#67e8f9

      - name: Publish animations to output branch
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          publish_dir="$RUNNER_TEMP/snake-output"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch --depth=1 origin output
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan output
          fi

          cp dist/github-snake.svg dist/github-snake-dark.svg "$publish_dir/"
          git -C "$publish_dir" add github-snake.svg github-snake-dark.svg
          if git -C "$publish_dir" diff --cached --quiet; then
            echo 'Contribution animations are already up to date.'
            exit 0
          fi

          git -C "$publish_dir" commit -m 'chore: refresh contribution snake'
          git -C "$publish_dir" push origin HEAD:output
